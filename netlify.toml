# Build settings for deploying from Git. Netlify reads this file from the repo
# root; the copy in public/ is a different job — it rides along into dist/ so a
# hand-dropped zip still gets the same headers. Change one, change both.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 and the build script need a modern runtime; 20 is the LTS Netlify
  # has had longest, so it's the least surprising choice.
  NODE_VERSION = "20"

# Only here so the US Chess rating lookup can run as a function on Netlify.
# If functions aren't enabled for this deploy the app falls back to a public
# reader, so ratings still work — see src/lib/ratings.js.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# sw.js's own cache-first strategy (see public/sw.js) is deliberate — the app
# has to open with no signal, so it always answers from its cache and only
# checks for an update in the background. But that logic can only ever run
# once the BROWSER has actually fetched a fresh copy of sw.js/index.html to
# begin with — if Netlify's CDN (or the browser's own HTTP cache) is also
# caching *those two files*, a reload can keep re-running the same stale
# service worker indefinitely, no matter how many times it's redeployed.
# no-cache here forces every load to revalidate them with the server first,
# so a new deploy is always at most one real reload away, not stuck behind
# however long Netlify's default asset caching happens to last.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
