<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Repertoire Lab</title>
    <meta name="theme-color" content="#14171d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Repertoire" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Display faces for the Drive-Thru, Rose and Chess Book themes. A font
         file only downloads once a page uses it, so the other themes never
         fetch these. Offline, those three themes fall back to the system
         faces named in styles.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Bodoni+Moda:ital,wght@1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <style>
      /* Painted before the app boots so there's no flash; the theme takes over
         once React applies data-theme. */
      html { background: #14171d; }
      html[data-theme="light"] { background: #f4f6fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
